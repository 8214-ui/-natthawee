/* ==========================================================
   QUIZ SYSTEM
   ========================================================== */

let submitted = false;


/* Initialize */

function init(){

  document.title = QUIZ.title;

  document.getElementById("title").textContent =
    QUIZ.title;

  document.getElementById("eyebrow").textContent =
    QUIZ.eyebrow;

  document.getElementById("description").textContent =
    QUIZ.description;

  renderQuiz();

}


/* Render questions */

function renderQuiz(){

  const quiz =
    document.getElementById("quiz");

  quiz.innerHTML = "";

  QUIZ.questions.forEach((item,i)=>{

    const card =
      document.createElement("section");

    card.className = "card";

    card.innerHTML =
      `
      <div class="q">
        ข้อ ${i+1}. ${escapeHTML(item.q)}
      </div>
      ` +

      item.a.map((choice,j)=>

        `
        <label class="opt">

          <input
            type="radio"
            name="q${i}"
            value="${j}"
            onchange="updateProgress()"
          >

          ${escapeHTML(choice)}

        </label>
        `

      ).join("");

    quiz.appendChild(card);

  });

  updateProgress();

}


/* Progress bar */

function updateProgress(){

  let answered = 0;

  QUIZ.questions.forEach((_,i)=>{

    if(
      document.querySelector(
        `input[name="q${i}"]:checked`
      )
    ){

      answered++;

    }

  });

  const percentage =
    (answered / QUIZ.questions.length) * 100;

  document.getElementById("bar")
    .style.width =
      `${percentage}%`;

}


/* Submit */

function submitQuiz(){

  let score = 0;

  let answered = 0;

  QUIZ.questions.forEach((item,i)=>{

    const el =
      document.querySelector(
        `input[name="q${i}"]:checked`
      );

    if(el){

      answered++;

      if(
        Number(el.value) === item.correct
      ){

        score += QUIZ.pointsPerQuestion;

      }

    }

  });


  if(
    answered <
    QUIZ.questions.length
  ){

    alert(
      `กรุณาตอบให้ครบ ${QUIZ.questions.length} ข้อก่อนส่งคำตอบ`
    );

    return;

  }


  submitted = true;


  document.getElementById("score")
    .textContent = score;


  document.getElementById("total")
    .textContent =
      QUIZ.questions.length *
      QUIZ.pointsPerQuestion;


  document.getElementById("resultText")
    .textContent =
      score >= QUIZ.passScore

      ? `ผ่านเกณฑ์ ${QUIZ.passScore} คะแนน`

      : `ยังไม่ผ่านเกณฑ์ ${QUIZ.passScore} คะแนน`;


  document.getElementById("result")
    .style.display = "block";


  document.getElementById("result")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* Reset */

function resetQuiz(){

  submitted = false;

  document.getElementById("result")
    .style.display = "none";


  document
    .querySelectorAll(
      'input[type="radio"]'
    )
    .forEach(
      x => x.checked = false
    );


  updateProgress();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* Security */

function escapeHTML(str){

  return String(str).replace(
    /[&<>'"]/g,

    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[c])

  );

}


/* Start */

init();

</script>
